# REC-007 — Watchdog externo de n8n
# Vive FUERA de n8n a propósito: si n8n muere, nadie dentro de n8n puede levantarlo.
# Cada 5 min: health check → si cae 5 veces seguidas (~2.5 min) → cooldown → última
# reconfirmación → reinicio vía EasyPanel → reverificar → avisar.
# Avisa SOLO cuando actúa (o cuando actuaría, en modo sombra). Un check exitoso solo deja log aquí.
# Registrado el 2026-09-14 (primer push del cron).
#
# 2026-09-17: incidente real (corrida 35238035232, 09:06-09:09 AM Monterrey) --
# n8n, EasyPanel Y Supabase (los 3 en el mismo VPS) dieron HTTP 000 (curl no pudo
# ni conectar, no fue un rechazo) durante ~2-3 min mientras WF01 (el cron interno
# de n8n) seguia corriendo sin huecos -- fue un blip de red hacia el VPS, no n8n
# caido de verdad. El aviso decia "EasyPanel NO aceptó la orden" cuando en
# realidad nunca se pudo ni conectar. Cambios de esta version:
#   1. Health check paso de 3 a 5 intentos (~70s -> ~150s de ventana) para
#      no reaccionar a un blip corto.
#   2. Reconfirmacion final justo antes de reiniciar -- si ya se recupero solo
#      mientras corria el cooldown, no se toca nada.
#   3. El reinicio en EasyPanel reintenta 1 vez mas antes de darse por vencido.
#   4. El mensaje y el log ya distinguen "no pude ni conectar" (HTTP 000) de un
#      rechazo real de EasyPanel (HTTP 4xx/5xx) -- son causas y fixes distintos.
#   5. El registro en vigilante_autofix_log reintenta 3 veces (ese POST tambien
#      fallo con 000 en el incidente real, y el intento se quedo sin rastro).
#
# 2026-09-18 (madrugada, corrida 35308023086): mismo blip de red, pero el aviso
# volvió a decir "EasyPanel RECHAZÓ la orden (revisar token/credenciales)" cuando
# en realidad el curl del reinicio dio timeout (exit 28), no un rechazo. Causa:
# cuando curl no logra conectar, `-w '%{http_code}'` YA imprime "000" por su
# cuenta, y el `|| echo 000` de respaldo se dispara ADEMÁS (porque curl también
# sale con código de error) -- las dos salidas se concatenan y el código queda
# "000000" en vez de "000". La comparación exacta `[ "$http" = "000" ]` nunca
# hace match con "000000", así que cae en la rama de "rechazado" (mensaje de
# revisar credenciales) en vez de "sin_conexion" (mensaje de problema de red).
# Fix: normalizar cada código a sus últimos 3 caracteres (`${var: -3}`) justo
# después de capturarlo con curl, en los 5 puntos del workflow que usan este
# patrón (health check, reconfirmación, reinicio, reverificación, log a
# Supabase) -- no solo donde rompía la lógica, también donde solo ensuciaba
# el log con "HTTP 000000".
#
# 2026-09-19: auditoria de 18 falsos positivos en 3 dias (ver REC-007 seccion 0.2 en
# Asistente_Empresarial). Causa: el camino runner-de-GitHub -> VPS se corta ~6 min
# (n8n, EasyPanel y Supabase dan timeout de CONEXION a la vez; n8n nunca se cayo).
# Cambios de esta version:
#   6. Si los 3 son inalcanzables a la vez (resultado restart_sin_conexion) el aviso
#      ya NO es "n8n caido": solo avisa si la corrida ANTERIOR tambien quedo
#      inalcanzable (dos strikes seguidos, ~10 min). Un solo strike = solo log.
#   7. Paso de diagnostico solo-lectura al fallar: IP y ASN del runner, puertos
#      80/22/443 y traceroute (destino enmascarado) para saber si es bloqueo de IP.
#   8. El reinicio a EasyPanel falla rapido (--connect-timeout 10) en vez de esperar
#      60 s x2: la corrida sin conexion baja de ~6 min a ~3.5 min.
#   9. Nuevo forzar_estado=inalcanzable para probar el camino sin tocar nada.
name: Watchdog n8n externo (REC-007)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      forzar_estado:
        description: "Prueba: 'caido' simula n8n caido; 'inalcanzable' simula VPS inalcanzable desde GitHub (no toca nada); 'caido_persistente' (solo con modo_prueba=true) fuerza también la reconfirmación a caído. Vacío = check normal."
        required: false
        default: ""
      modo_prueba:
        description: "Solo prueba (spec 001): true = NUNCA llama a EasyPanel, usa las tablas de abajo (deben ser de prueba), imprime la marca de prueba y antepone [PRUEBA] a todo Telegram. Normal = false."
        type: boolean
        required: false
        default: false
      tabla_config:
        description: "Solo prueba: tabla del interruptor PARA TODO (vacío = vigilante_config). Con modo_prueba=true debe ser de prueba."
        required: false
        default: ""
      tabla_log:
        description: "Solo prueba: bitácora de intentos (vacío = vigilante_autofix_log). Con modo_prueba=true debe ser de prueba."
        required: false
        default: ""

# Idempotencia: nunca dos corridas a la vez; la segunda espera a que termine la primera.
concurrency:
  group: watchdog-n8n
  cancel-in-progress: false

permissions:
  actions: read   # solo para leer el log de la corrida anterior (regla de 2 strikes)

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      N8N_HEALTH_URL: ${{ secrets.N8N_HEALTH_URL }}
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_TOKEN: ${{ secrets.EASYPANEL_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EASYPANEL_PROJECT: ${{ secrets.EASYPANEL_PROJECT }}
      EASYPANEL_SERVICE: ${{ secrets.EASYPANEL_SERVICE }}
      MODO_SOMBRA: ${{ vars.MODO_SOMBRA }}
      COOLDOWN_MIN: ${{ vars.COOLDOWN_MIN }}
      FORZAR_ESTADO: ${{ github.event.inputs.forzar_estado }}
      # Spec 001 (PARA TODO): solo prueba. Una corrida normal (cron) tiene MODO_PRUEBA=false y las tablas reales.
      MODO_PRUEBA: ${{ github.event.inputs.modo_prueba == 'true' }}
      TABLA_CONFIG: ${{ github.event.inputs.tabla_config || 'vigilante_config' }}
      TABLA_LOG: ${{ github.event.inputs.tabla_log || 'vigilante_autofix_log' }}
      # Tope de corridas hacia atrás al buscar el último valor leído del interruptor (medido en T8: ver README)
      MAX_CORRIDAS_MEMORIA: "60"
      RECETA_ID: REC-007
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validar configuración
        run: |
          faltan=""
          for v in N8N_HEALTH_URL EASYPANEL_URL EASYPANEL_TOKEN SUPABASE_URL SUPABASE_SERVICE_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID EASYPANEL_PROJECT EASYPANEL_SERVICE MODO_SOMBRA COOLDOWN_MIN; do
            if [ -z "${!v}" ]; then faltan="$faltan $v"; fi
          done
          if [ -n "$faltan" ]; then echo "::error::Faltan secrets/variables:$faltan"; exit 1; fi
          # Nombres de tabla: solo minúsculas, dígitos y guion bajo (van directo a la URL de PostgREST)
          for v in TABLA_CONFIG TABLA_LOG; do
            if ! echo "${!v}" | grep -Eq '^[a-z0-9_]+$'; then echo "::error::$v tiene caracteres no permitidos"; exit 1; fi
          done
          if [ "$MODO_PRUEBA" = "true" ]; then
            # Una corrida de prueba nunca toca tablas reales: ambas tablas deben ser de prueba.
            for v in TABLA_CONFIG TABLA_LOG; do
              case "${!v}" in
                *_prueba*) ;;
                *) echo "::error::modo_prueba=true no puede usar tablas reales ($v=${!v}): una corrida de prueba solo usa tablas de prueba"; exit 1 ;;
              esac
            done
          else
            if [ "$FORZAR_ESTADO" = "caido_persistente" ]; then echo "::error::forzar_estado=caido_persistente solo existe con modo_prueba=true"; exit 1; fi
            if [ "$TABLA_CONFIG" != "vigilante_config" ] || [ "$TABLA_LOG" != "vigilante_autofix_log" ]; then echo "::error::tabla_config/tabla_log solo se pueden cambiar con modo_prueba=true"; exit 1; fi
          fi
          echo "Config OK | modo_sombra=$MODO_SOMBRA | cooldown=${COOLDOWN_MIN} min | modo_prueba=$MODO_PRUEBA | tabla_config=$TABLA_CONFIG | tabla_log=$TABLA_LOG"

      - name: Leer interruptor PARA TODO
        id: pausa
        continue-on-error: true
        timeout-minutes: 4
        run: |
          # OJO: GitHub imprime el fuente del paso en el log: las marcas se arman con variables (nada literal aquí).
          # La corrida real y la de prueba usan marcas distintas: una prueba nunca contamina el valor recordado de producción.
          T=MARCA; P=PAUSA
          if [ "$MODO_PRUEBA" = "true" ]; then M="${T}${P}_PRUEBA="; else M="${T}${P}="; fi
          # Por defecto: nunca leído (si el paso muere a medias, el reinicio falla cerrado: solo actúa con pausa=false)
          echo "pausa=desconocida" >> "$GITHUB_OUTPUT"; echo "origen=nunca" >> "$GITHUB_OUTPUT"
          resp=$(curl -sf --max-time 15 -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/$TABLA_CONFIG?select=autofix_pausado&limit=1") || resp=""
          val=$(echo "$resp" | jq -r 'if (type=="array" and length>0 and (.[0].autofix_pausado|type=="boolean")) then (.[0].autofix_pausado|tostring) else "ilegible" end' 2>/dev/null || true)
          if [ "$val" = "true" ] || [ "$val" = "false" ]; then
            echo "${M}${val}"
            echo "Interruptor PARA TODO: origen=leido pausa=$val (tabla $TABLA_CONFIG)"
            echo "pausa=$val" >> "$GITHUB_OUTPUT"; echo "origen=leido" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "AVISO: no pude leer el interruptor PARA TODO en $TABLA_CONFIG (Supabase no responde o la fila no existe). Busco el último valor leído en corridas previas (tope $MAX_CORRIDAS_MEMORIA)."
          # Último valor leído: la primera corrida completada (hacia atrás) cuyo log tenga la marca del MISMO modo.
          vistas=0; pagina=1; hallado=""; run_origen=""; inicio=$SECONDS; por_pagina=100
          if [ "$MAX_CORRIDAS_MEMORIA" -lt "$por_pagina" ]; then por_pagina="$MAX_CORRIDAS_MEMORIA"; fi
          # Cuota de la API que ve ESTE token (cabeceras x-ratelimit-*; la consulta cuenta 1 llamada)
          cuota() { curl -sI --max-time 10 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY" | tr -d '\r' | grep -ai '^x-ratelimit-\(limit\|remaining\|resource\):' | sed 's/^x-ratelimit-//I' | tr '\n' ' ' || true; }
          lim0=$(cuota)
          while [ -z "$hallado" ] && [ "$vistas" -lt "$MAX_CORRIDAS_MEMORIA" ] && [ $((SECONDS - inicio)) -lt 170 ]; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/watchdog-n8n.yml/runs?status=completed&per_page=$por_pagina&page=$pagina" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id" 2>/tmp/e0) || { echo "memoria: no pude listar corridas: $(head -c 150 /tmp/e0)"; break; }
            if [ -z "$ids" ]; then echo "memoria: no hay más corridas"; break; fi
            for rid in $ids; do
              if [ "$vistas" -ge "$MAX_CORRIDAS_MEMORIA" ] || [ $((SECONDS - inicio)) -ge 170 ]; then break; fi
              vistas=$((vistas+1))
              jid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/jobs" --jq '.jobs[0].id' 2>/dev/null) || continue
              if [ -z "$jid" ] || [ "$jid" = "null" ]; then continue; fi
              lg=$(curl -sfL --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$jid/logs" 2>/dev/null) || continue
              m=$(echo "$lg" | grep -aoE "${M}(true|false)" || true)
              m="${m%%$'\n'*}"
              if [ -n "$m" ]; then hallado="${m#"$M"}"; run_origen="$rid"; break; fi
            done
            pagina=$((pagina+1))
          done
          lim1=$(cuota)
          echo "MEMORIA: corridas leídas=$vistas (tope $MAX_CORRIDAS_MEMORIA) en $((SECONDS - inicio)) s; cuota de la API antes [$lim0] después [$lim1]"
          if [ "$hallado" = "true" ] || [ "$hallado" = "false" ]; then
            echo "Interruptor PARA TODO: origen=recordado pausa=$hallado (de la corrida $run_origen)"
            echo "pausa=$hallado" >> "$GITHUB_OUTPUT"; echo "origen=recordado" >> "$GITHUB_OUTPUT"
          else
            echo "Interruptor PARA TODO: origen=nunca pausa=desconocida (ninguna corrida con valor leído dentro del tope)"
          fi

      - name: Health check de n8n (5 intentos, 20 s entre cada uno, ~2.5 min)
        id: salud
        run: |
          if [ "$FORZAR_ESTADO" = "caido" ] || [ "$FORZAR_ESTADO" = "caido_persistente" ]; then
            echo "PRUEBA: estado forzado a '$FORZAR_ESTADO' (el servicio NO fue tocado)"
            echo "estado=caido" >> "$GITHUB_OUTPUT"; echo "codigo=SIMULADO" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$FORZAR_ESTADO" = "inalcanzable" ]; then
            echo "PRUEBA: estado forzado a 'inalcanzable' (nada fue tocado)"
            echo "estado=caido" >> "$GITHUB_OUTPUT"; echo "codigo=000" >> "$GITHUB_OUTPUT"; exit 0
          fi
          codigo=000
          for i in 1 2 3 4 5; do
            codigo=$(curl -sS -o /tmp/salud.json -w '%{http_code}' --max-time 15 "$N8N_HEALTH_URL" 2>/dev/null || echo 000)
            codigo="${codigo: -3}"
            cuerpo=$(head -c 200 /tmp/salud.json 2>/dev/null || true)
            if [ "$codigo" = "200" ] && echo "$cuerpo" | grep -q '"status":"ok"'; then
              echo "OK: el servicio responde 200 status=ok (intento $i). Sin acción."
              echo "estado=ok" >> "$GITHUB_OUTPUT"; echo "codigo=$codigo" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "AVISO: intento $i/5 -> HTTP $codigo cuerpo='$cuerpo'"
            if [ "$i" -lt 5 ]; then sleep 20; fi
          done
          echo "CAIDO: el servicio no responde tras 5 intentos en ~2.5 min (último HTTP $codigo)"
          echo "estado=caido" >> "$GITHUB_OUTPUT"; echo "codigo=$codigo" >> "$GITHUB_OUTPUT"

      - name: Diagnóstico de red (solo lectura, solo si falló)
        if: steps.salud.outputs.estado == 'caido' && !github.event.inputs.forzar_estado
        continue-on-error: true
        timeout-minutes: 2
        run: |
          HOST=$(echo "$N8N_HEALTH_URL" | sed -E 's#https?://([^/:]+).*#\1#')
          VPS=$(getent ahostsv4 "$HOST" | awk '{print $1; exit}')
          MYIP=$(curl -s --max-time 8 https://api.ipify.org || echo "?")
          ORG=$(curl -s --max-time 8 "https://ipinfo.io/$MYIP/org" || echo "?")
          p() { timeout 5 bash -c "</dev/tcp/$VPS/$1" >/dev/null 2>&1 && echo abre || echo SIN-RESPUESTA; }
          echo "DIAG runner_ip=$MYIP asn=[$ORG] puerto443=$(p 443) puerto80=$(p 80) puerto22=$(p 22) control_cloudflare=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://www.cloudflare.com || echo 000)"
          sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq traceroute >/dev/null 2>&1
          sudo timeout 40 traceroute -T -p 443 -n -w 2 -m 18 "$VPS" 2>&1 | sed "s/$VPS/VPS/g; s/$HOST/HOST/g" | sed 's/^/DIAG-TRACE /' || true

      - name: Cooldown (¿ya se actuó en los últimos minutos?)
        id: cooldown
        if: steps.salud.outputs.estado == 'caido'
        run: |
          desde=$(date -u -d "-${COOLDOWN_MIN} minutes" +%Y-%m-%dT%H:%M:%SZ)
          resp=$(curl -sf --max-time 15 -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"             "$SUPABASE_URL/rest/v1/$TABLA_LOG?receta_id=eq.$RECETA_ID&iniciado_en=gte.$desde&select=id") || resp=""
          n=$(echo "$resp" | jq 'length' 2>/dev/null || echo "error")
          [ -z "$resp" ] && n="error"
          if [ "$n" = "error" ]; then
            echo "AVISO: no se pudo consultar el cooldown en Supabase. Por seguridad se actúa igual (n8n caído pesa más)."
            echo "actuar=si" >> "$GITHUB_OUTPUT"
          elif [ "$n" -gt 0 ]; then
            echo "PAUSA: ya hubo $n acción(es) de $RECETA_ID en los últimos $COOLDOWN_MIN min. No se repite (idempotencia)."
            echo "actuar=no" >> "$GITHUB_OUTPUT"
          else
            echo "Sin acciones recientes. Se procede."
            echo "actuar=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Reiniciar n8n vía EasyPanel (o solo simular, en modo sombra)
        id: accion
        if: steps.salud.outputs.estado == 'caido' && steps.cooldown.outputs.actuar == 'si'
        env:
          PAUSA_VAL: ${{ steps.pausa.outputs.pausa }}
          PAUSA_ORIGEN: ${{ steps.pausa.outputs.origen }}
        run: |
          inicio=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "inicio=$inicio" >> "$GITHUB_OUTPUT"

          if [ "$FORZAR_ESTADO" = "inalcanzable" ]; then
            echo "PRUEBA: se simula que EasyPanel tampoco conecta (nada fue tocado)"
            echo "modo=real" >> "$GITHUB_OUTPUT"; echo "http_restart=000" >> "$GITHUB_OUTPUT"; echo "resultado=restart_sin_conexion" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Última oportunidad: el blip pudo resolverse solo mientras corría el
          # cooldown (2026-09-17: la caída real duró ~2-3 min, tiempo de sobra
          # para colarse en esta ventana). Reinicia solo si SIGUE caído.
          if [ "$FORZAR_ESTADO" = "caido_persistente" ]; then
            codigo_final=000   # solo prueba: la reconfirmación también da «caído»
          else
            codigo_final=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$N8N_HEALTH_URL" 2>/dev/null || echo 000)
            codigo_final="${codigo_final: -3}"
          fi
          if [ "$codigo_final" = "200" ]; then
            echo "RECUPERADO SOLO justo antes de actuar (HTTP $codigo_final). No se reinicia nada."
            echo "modo=ninguno" >> "$GITHUB_OUTPUT"; echo "resultado=recuperado_solo" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # PARA TODO (spec 001): se decide ANTES de cualquier acción. Solo se actúa con pausa=false (leída o recordada);
          # pausa=true o ilegible-sin-valor-recordado fallan cerrado (no se reinicia y se avisa).
          if [ "$PAUSA_VAL" = "true" ]; then
            echo "PAUSADO: PARA TODO está prendido (origen=$PAUSA_ORIGEN). No se reinicia nada."
            echo "modo=ninguno" >> "$GITHUB_OUTPUT"; echo "resultado=pausado" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$PAUSA_VAL" != "false" ]; then
            echo "PAUSADO: no pude leer el interruptor PARA TODO y no hay valor recordado. Por seguridad no se reinicia nada."
            echo "modo=ninguno" >> "$GITHUB_OUTPUT"; echo "resultado=pausado_ilegible" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Modo prueba: NUNCA se llama a EasyPanel (el bloque de reinicio real de abajo no se alcanza).
          if [ "$MODO_PRUEBA" = "true" ]; then
            echo "HABRIA REINICIADO (modo prueba)"
            echo "modo=sombra" >> "$GITHUB_OUTPUT"; echo "resultado=sombra_prueba" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "$MODO_SOMBRA" = "true" ]; then
            echo "MODO SOMBRA: aquí se habría reiniciado el servicio vía EasyPanel. No se ejecuta nada."
            echo "modo=sombra" >> "$GITHUB_OUTPUT"; echo "resultado=sombra" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "modo=real" >> "$GITHUB_OUTPUT"
          cuerpo=$(jq -n --arg p "$EASYPANEL_PROJECT" --arg s "$EASYPANEL_SERVICE" '{json:{projectName:$p, serviceName:$s}}')
          http=000
          for intento in 1 2; do
            http=$(curl -sS -o /tmp/restart.json -w '%{http_code}' --connect-timeout 10 --max-time 60 -X POST \
              -H "Authorization: Bearer $EASYPANEL_TOKEN" -H "Content-Type: application/json" \
              "$EASYPANEL_URL/api/trpc/services.app.restartService" -d "$cuerpo" || echo 000)
            http="${http: -3}"
            echo "EasyPanel respondió HTTP $http (intento $intento/2): $(head -c 300 /tmp/restart.json)"
            if [ "$http" = "200" ]; then break; fi
            [ "$intento" -eq 1 ] && sleep 10
          done
          echo "http_restart=$http" >> "$GITHUB_OUTPUT"
          if [ "$http" != "200" ]; then
            if [ "$http" = "000" ]; then
              echo "resultado=restart_sin_conexion" >> "$GITHUB_OUTPUT"
            else
              echo "resultado=restart_rechazado" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          for i in $(seq 1 15); do
            sleep 10
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$N8N_HEALTH_URL" 2>/dev/null || echo 000)
            codigo="${codigo: -3}"
            echo "reverificación $i/15: HTTP $codigo"
            if [ "$codigo" = "200" ]; then echo "resultado=resuelto" >> "$GITHUB_OUTPUT"; echo "segundos=$((i*10))" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "resultado=sigue_caido" >> "$GITHUB_OUTPUT"

      - name: Registrar en vigilante_autofix_log y avisar por Telegram
        if: steps.salud.outputs.estado == 'caido' && steps.cooldown.outputs.actuar == 'si'
        env:
          MODO: ${{ steps.accion.outputs.modo }}
          RES: ${{ steps.accion.outputs.resultado }}
          INICIO: ${{ steps.accion.outputs.inicio }}
          SEGUNDOS: ${{ steps.accion.outputs.segundos }}
          CODIGO: ${{ steps.salud.outputs.codigo }}
          HTTP_RESTART: ${{ steps.accion.outputs.http_restart }}
          PAUSA_VAL: ${{ steps.pausa.outputs.pausa }}
          PAUSA_ORIGEN: ${{ steps.pausa.outputs.origen }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # OJO: GitHub imprime el codigo fuente del paso en el log, asi que el texto de la marca
          # NO puede aparecer literal aqui (se armaria un falso positivo en cada corrida).
          T=MARCA
          # Una corrida de prueba usa otras marcas de 2 strikes: nunca cuenta como «corrida previa inalcanzable» de producción.
          if [ "$MODO_PRUEBA" = "true" ]; then T=MARCAPRUEBA; fi
          # Regla de 2 strikes: la corrida anterior (si fue hace <25 min) ¿quedó inalcanzable y aún sin avisar?
          previa_inalcanzable() {
            local fila pid creada jid log err
            fila=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/watchdog-n8n.yml/runs?status=completed&per_page=5" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0] | [.id,.created_at] | @tsv" 2>/tmp/e1) || { echo "previa: no pude listar corridas: $(head -c 150 /tmp/e1)"; return 1; }
            pid=$(echo "$fila" | cut -f1); creada=$(echo "$fila" | cut -f2)
            [ -n "$pid" ] && [ "$pid" != "null" ] || { echo "previa: sin corrida anterior"; return 1; }
            [ $(( $(date -u +%s) - $(date -u -d "$creada" +%s) )) -lt 1500 ] || { echo "previa: la corrida anterior es de hace más de 25 min"; return 1; }
            jid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pid/jobs" --jq '.jobs[0].id' 2>/tmp/e2) || { echo "previa: no pude leer jobs: $(head -c 150 /tmp/e2)"; return 1; }
            log=$(curl -sfL --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$jid/logs" 2>/tmp/e3) || { echo "previa: no pude leer el log: $(head -c 150 /tmp/e3)"; return 1; }
            echo "previa: corrida $pid, log de ${#log} bytes"
            echo "$log" | grep -aq "${T}=INALCANZABLE" && ! echo "$log" | grep -aq "${T}=ALERTADO"
          }
          motivo=""
          case "$RES" in
            pausado)               estado="pausado";  motivo="PARA TODO"; txt="⏸️ <b>[Watchdog n8n externo · PAUSADO]</b> n8n no respondió 5 veces seguidas (HTTP $CODIGO) pero NO lo reinicio: PARA TODO está prendido. Hora $INICIO. Acción: ninguna. Al quitar la pausa, reinicio en la siguiente corrida si sigue caído." ;;
            pausado_ilegible)      estado="pausado";  motivo="interruptor ilegible"; txt="⏸️ <b>[Watchdog n8n externo · PAUSADO]</b> n8n no respondió 5 veces seguidas (HTTP $CODIGO) pero NO lo reinicio: no pude leer el interruptor PARA TODO (Supabase no responde) y no tengo un valor recordado; por seguridad no reinicio. Hora $INICIO. Acción: ninguna." ;;
            sombra_prueba)         estado="sombra";   txt="🧪 <b>[Watchdog n8n externo]</b> PRUEBA: n8n simulado caído (HTTP $CODIGO); en modo real lo habría reiniciado vía EasyPanel. No se hizo nada." ;;
            recuperado_solo)      estado="resuelto"; txt="🟡 <b>[Watchdog n8n externo]</b> n8n no respondió varias veces seguidas (HTTP $CODIGO), pero volvió a responder solo justo antes de que se intentara reiniciar. No se tocó nada." ;;
            sombra)                estado="sombra";   txt="🌓 <b>[Watchdog n8n externo]</b> MODO SOMBRA: n8n no respondió 5 veces seguidas en ~2.5 min (HTTP $CODIGO). En modo real aquí lo habría reiniciado vía EasyPanel. No se hizo nada." ;;
            resuelto)               estado="resuelto"; txt="✅ <b>[Watchdog n8n externo]</b> n8n no respondía (HTTP $CODIGO). Lo reinicié vía EasyPanel y volvió a responder en $SEGUNDOS s." ;;
            sigue_caido)            estado="fallido";  txt="🔴 <b>[Watchdog n8n externo]</b> n8n no respondía. Lo reinicié vía EasyPanel pero SIGUE sin responder después de 150 s. Revisar a mano (EasyPanel → servicio de n8n → logs)." ;;
            restart_sin_conexion)
              echo "${T}=INALCANZABLE"
              if previa_inalcanzable; then
                echo "${T}=ALERTADO"
                estado="fallido"; txt="🟠 <b>[Watchdog n8n externo]</b> No alcanzo el VPS desde GitHub en 2 corridas seguidas (~10 min): n8n, EasyPanel y Supabase no contestan. Casi seguro es la red hacia el VPS y n8n sigue vivo por dentro (si siguen llegando avisos del Vigilante, es eso). Si dura más, revisar el VPS en Hostinger."
              else
                echo "Primera vez que no alcanzo el VPS: sin aviso (se avisa si la siguiente corrida también falla). Solo queda en el log."
                exit 0
              fi ;;
            restart_rechazado)      estado="fallido";  txt="🔴 <b>[Watchdog n8n externo]</b> n8n no responde y EasyPanel RECHAZÓ la orden de reinicio (HTTP $HTTP_RESTART). Revisar token/credenciales de EasyPanel. Revisar a mano." ;;
            *)                      estado="fallido";  txt="🔴 <b>[Watchdog n8n externo]</b> n8n no responde y el reinicio terminó en estado desconocido ('$RES'). Revisar a mano." ;;
          esac
          # Si el interruptor no se pudo leer y se usó el valor recordado, el aviso lo dice (spec 001)
          if [ "$PAUSA_ORIGEN" = "recordado" ] && [ "$RES" != "pausado" ]; then
            txt="$txt"$'\n'"Interruptor PARA TODO: Supabase no respondía; usé el valor recordado de la última lectura (pausa=$PAUSA_VAL)."
          fi
          # Todo Telegram de una corrida de prueba lleva el prefijo [PRUEBA] (se antepone al final, para cualquier resultado)
          if [ "$MODO_PRUEBA" = "true" ]; then txt="[PRUEBA] $txt"; fi
          echo "Resultado=$RES motivo=$motivo pausa_origen=$PAUSA_ORIGEN modo_prueba=$MODO_PRUEBA"
          body=$(jq -n --arg r "$RECETA_ID" --arg m "$MODO" --arg e "$estado" --arg ini "$INICIO" --arg url "$RUN_URL" --arg cod "$CODIGO" --arg hr "$HTTP_RESTART" --arg mot "$motivo" --arg po "$PAUSA_ORIGEN" --arg mp "$MODO_PRUEBA" \
            '{receta_id:$r, intento:1, modo:$m, estado:$e, iniciado_en:$ini, finalizado_en:(now|todate), resultado:{origen:"github_actions", run:$url, http_salud:$cod, http_restart:$hr, motivo:$mot, pausa_origen:$po, modo_prueba:($mp=="true")}, verificacion:{resultado:$e}}')
          http=000
          for intento in 1 2 3; do
            http=$(curl -sS -o /tmp/log.json -w '%{http_code}' --max-time 15 -X POST \
              -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              "$SUPABASE_URL/rest/v1/$TABLA_LOG" -d "$body" || echo 000)
            http="${http: -3}"
            echo "Supabase autofix_log intento $intento/3: HTTP $http $(head -c 200 /tmp/log.json)"
            case "$http" in 2??) break ;; esac
            [ "$intento" -lt 3 ] && sleep 5
          done
          txt="$txt"$'\n'"Corrida: $RUN_URL"
          if [ "$MODO_PRUEBA" = "true" ]; then echo "TELEGRAM_TEXTO: $txt"; fi
          http=$(curl -sS -o /tmp/tg.json -w '%{http_code}' --max-time 15 -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "parse_mode=HTML" --data-urlencode "text=$txt" || echo 000)
          http="${http: -3}"
          echo "Telegram: HTTP $http"
